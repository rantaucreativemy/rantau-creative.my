<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCMS | RANTAU CREATIVE</title>
<style>
:root{--blue:#2584c7;--blue2:#176da9;--line:#d8dde2;--bg:#f3f5f7;--text:#27313a;--muted:#78838d;--white:#fff;--gold:#b58a37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,Helvetica,sans-serif}
.top{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px;position:sticky;top:0;z-index:5}
.brand{font-weight:800;letter-spacing:1.5px;color:#17232c}.brand span{color:var(--gold)}.crumbtop{color:#7c8790;font-size:12px}
.app{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 52px)}
aside{background:#f8f9fa;border-right:1px solid var(--line);padding:14px 10px;overflow:auto;height:calc(100vh - 52px);position:sticky;top:52px}
.group{font-size:10px;letter-spacing:1.3px;font-weight:bold;color:#87919a;margin:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;color:#277fb8;cursor:pointer;font-size:13px}
.nav:hover{background:#eaf2f8}.nav.active{background:#e6edf2;color:#26343e;font-weight:bold}.ico{width:16px;text-align:center;color:#7d8992}.count{margin-left:auto;background:#fff;border:1px solid #e1e5e8;border-radius:4px;padding:2px 6px;color:#77818a;font-size:11px}
main{padding:22px 24px;min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.company{font-size:17px;font-weight:600}.company small{color:#86919a;font-size:12px;font-weight:normal}
h1{font-size:23px;margin:0 0 5px;font-weight:600}.sub{color:#87919a;font-size:12px;margin-bottom:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:4px;padding:9px 13px;cursor:pointer;font-weight:600;color:#34414b}.btn:hover{background:#f3f7fa}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:var(--blue2)}.gold{background:#c49a42;border-color:#c49a42;color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:5px;margin-bottom:16px}.panelhead{padding:13px 15px;border-bottom:1px solid #e6e9ec;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.tools{display:flex;gap:8px;align-items:center}.tools input{width:220px}
input,select,textarea{font:14px Arial;border:1px solid #d6dce1;border-radius:5px;padding:9px 10px;background:#fff;color:#28343d;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #c7e2f5;border-color:#78b9e4}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #edf0f2;font-size:12px}th{color:#61717d;background:#fafbfc;font-weight:600}td.empty{text-align:center;color:#9aa3aa;padding:42px}
.actions{display:flex;gap:6px}.link{color:#237eb8;cursor:pointer;text-decoration:none}.muted{color:#8b969e}
.cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin:16px 0}.metric{background:#fff;border:1px solid var(--line);padding:16px;border-radius:5px}.metric small{color:#82909a}.metric strong{display:block;font-size:22px;margin-top:8px}
.formwrap{background:#fff;border:1px solid var(--line);border-radius:5px}.formtitle{padding:18px 22px;border-bottom:1px solid #e6e9ec;color:#a3adb5;font-size:16px}.formbody{padding:18px 22px}.formgrid{display:grid;grid-template-columns: minmax(180px,286px) minmax(110px,150px) 1fr;gap:14px 8px;align-items:start}.field{display:flex;flex-direction:column;gap:7px}.field.wide{grid-column:1/3}.field label{font-weight:500}.field textarea{min-height:92px;resize:vertical}.formfoot{padding:14px 22px;background:#fafbfc;border-top:1px solid #e6e9ec;display:flex;gap:8px}
.modalback{position:fixed;inset:0;background:#0005;z-index:10;display:none;overflow:auto;padding:35px 14px}.modal{max-width:1000px;margin:auto;background:#fff;border-radius:7px;box-shadow:0 10px 40px #0003}.modalhead{display:flex;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:bold}.modalbody{padding:20px}.close{border:0;background:none;font-size:22px;cursor:pointer;color:#7d8992}
.note{font-size:11px;color:#8b969e;margin-top:18px}.pill{display:inline-block;background:#eef4f8;color:#397ba5;border-radius:12px;padding:4px 8px;font-size:11px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{height:auto;position:relative;top:0;display:flex;flex-wrap:wrap;gap:2px}.group{width:100%}main{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}.field.wide{grid-column:1/3}}
</style></head>
<body>
<div class="top"><div class="brand">RANTAU <span>CREATIVE</span></div><div class="crumbtop">/ RCMS</div><div style="margin-left:auto;font-size:12px;color:#66737d">RANTAU CREATIVE Admin · <span id="userLabel">Admin</span></div></div>
<div class="app"><aside id="sidebar"></aside><main>
<div class="toolbar"><div class="company">RANTAU CREATIVE <small>/ Management System</small></div><button class="btn" onclick="exportData()">Export Data</button></div>
<div id="content"></div>
<div class="note">RCMS · Versi prototaip setempat. Data disimpan dalam pelayar komputer ini sahaja; belum disambungkan kepada pangkalan data dalam talian atau akaun berbilang pengguna.</div>
</main></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><span id="modalTitle">New Record</span><button class="close" onclick="closeModal()">×</button></div><div class="modalbody" id="modalBody"></div></div></div>
<script>
const groups={
'UTAMA':['Dashboard'],
'KEWANGAN':['Bank & Cash Accounts','Receipts','Payments','Inter Account Transfers','Bank Reconciliations','Expense Claims','Expenses'],
'JUALAN':['Customers','Quotations','Sales Quotes','Sales Orders','Sales Invoices','Credit Notes','Delivery Notes'],
'PEMBELIAN & STOK':['Suppliers','Purchase Orders','Purchase Invoices','Debit Notes','Inventory Items','Inventory Write-offs','Production Orders'],
'PENGURUSAN':['Employees','Payslips','Fixed Assets'],
'PERAKAUNAN & LAPORAN':['Journal Entries','Chart of Accounts','Reports'],
'PENTADBIRAN':['Users & Roles','Settings']
};
const schema={
'Bank & Cash Accounts':['Name','Account Number','Currency','Opening Balance'],
'Receipts':['Date','Reference','Customer','Account','Amount','Description'],
'Payments':['Date','Reference','Supplier / Payee','Account','Amount','Description'],
'Inter Account Transfers':['Date','From Account','To Account','Amount','Description'],
'Bank Reconciliations':['Date','Bank Account','Statement Balance','Reference'],
'Expense Claims':['Date','Employee','Description','Amount','Status'],
'Expenses':['Date','Payee','Expense Account','Amount','Description'],
'Customers':['Name','Code','Address','Email','Phone','Currency'],
'Quotations':['Quotation Date','Quotation Number','Customer','Valid Until','Service / Item','Description','Quantity','Unit Price','Discount','Tax','Total','Terms & Conditions','Status'],
'Sales Quotes':['Date','Quote Number','Customer','Description','Quantity','Unit Price','Status'],
'Sales Orders':['Date','Order Number','Customer','Inventory Item','Description','Quantity','Unit Price','Status'],
'Sales Invoices':['Date','Invoice Number','Customer','Inventory Item','Description','Quantity','Unit Price','Tax','Due Date','Status'],
'Credit Notes':['Date','Credit Note Number','Customer','Invoice Number','Description','Amount'],
'Delivery Notes':['Date','Delivery Note Number','Customer','Sales Order','Description','Status'],
'Suppliers':['Name','Code','Address','Email','Phone','Currency'],
'Purchase Orders':['Date','Order Number','Supplier','Description','Quantity','Unit Price','Status'],
'Purchase Invoices':['Date','Invoice Number','Supplier','Description','Quantity','Unit Price','Due Date','Status'],
'Debit Notes':['Date','Debit Note Number','Supplier','Purchase Invoice','Description','Amount'],
'Inventory Items':['Name','Code','Description','Quantity','Unit Cost','Sales Price'],
'Inventory Write-offs':['Date','Item','Quantity','Reason'],
'Production Orders':['Date','Order Number','Item','Quantity','Status'],
'Employees':['Name','Code','Address','Email','Phone','Currency'],
'Payslips':['Date','Employee','Pay Period','Basic Salary','Allowances','Deductions','Net Pay'],
'Fixed Assets':['Name','Code','Purchase Date','Cost','Useful Life','Depreciation Method'],
'Journal Entries':['Date','Reference','Account','Debit','Credit','Description'],
'Chart of Accounts':['Name','Code','Account Type','Control Account'],
'Users & Roles':['Name','Username','Role','Status'],
'Settings':['Company Name','Registration Number','Address','Email','Phone','Currency']
};
let current='Dashboard', editIndex=null;
let db=JSON.parse(localStorage.getItem('rcms_db')||'{}');
function save(){localStorage.setItem('rcms_db',JSON.stringify(db))}
function records(m){return db[m]||[]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildNav(){let h='';for(const [g,items] of Object.entries(groups)){h+=`<div class="group">${g}</div>`;for(const item of items){h+=`<div class="nav ${current===item?'active':''}" onclick="go('${item.replace(/'/g,"\\'")}')"><span class="ico">${item==='Dashboard'?'▦':'▤'}</span>${item}${item!=='Dashboard'?`<span class="count">${records(item).length}</span>`:''}</div>`}}document.getElementById('sidebar').innerHTML=h}
function go(m){current=m;buildNav();render()}
function render(){const c=document.getElementById('content');if(current==='Dashboard'){
let total=Object.values(db).reduce((a,x)=>a+x.length,0);
let sum=(m,f)=>records(m).reduce((a,r)=>a+(Number(r[f])||0),0);
let revenue=sum('Sales Invoices','Total')||records('Sales Invoices').reduce((a,r)=>a+(Number(r.Quantity)||0)*(Number(r['Unit Price'])||0),0);
let stock=records('Inventory Items').reduce((a,r)=>a+(Number(r.Quantity)||0),0);
let orders=records('Sales Orders').length, invoices=records('Sales Invoices').length;
let outstanding=records('Sales Invoices').filter(r=>(r.Status||'').toLowerCase()!=='paid').reduce((a,r)=>a+(Number(r.Total)||((Number(r.Quantity)||0)*(Number(r['Unit Price'])||0))),0);
c.innerHTML=`<h1>Summary</h1><div class="sub">Ringkasan kewangan dan operasi RANTAU CREATIVE</div>
<div class="cards">
<div class="metric"><small>Sales Invoices</small><strong>${invoices}</strong></div>
<div class="metric"><small>Sales Orders</small><strong>${orders}</strong></div>
<div class="metric"><small>Jumlah Jualan</small><strong>RM ${revenue.toFixed(2)}</strong></div>
<div class="metric"><small>Belum Dibayar</small><strong>RM ${outstanding.toFixed(2)}</strong></div>
<div class="metric"><small>Inventory Items</small><strong>${records('Inventory Items').length}</strong></div>
<div class="metric"><small>Jumlah Unit Stok</small><strong>${stock}</strong></div>
<div class="metric"><small>Customers</small><strong>${records('Customers').length}</strong></div>
<div class="metric"><small>Jumlah Rekod</small><strong>${total}</strong></div></div>
<div class="panel"><div class="panelhead">Ringkasan Jualan Terkini</div>
<table><thead><tr><th>Tarikh</th><th>Invoice</th><th>Customer</th><th>Status</th><th>Jumlah</th></tr></thead><tbody>
${records('Sales Invoices').slice(-5).reverse().map(r=>`<tr><td>${esc(r.Date||'')}</td><td>${esc(r['Invoice Number']||'')}</td><td>${esc(r.Customer||'')}</td><td>${esc(r.Status||'Draft')}</td><td>RM ${((Number(r.Total)||((Number(r.Quantity)||0)*(Number(r['Unit Price'])||0))).toFixed(2))}</td></tr>`).join('')||'<tr><td class="empty" colspan="5">Belum ada invois jualan.</td></tr>'}
</tbody></table></div>
<div class="panel"><div class="panelhead">Akses Pantas</div><div style="padding:15px;display:flex;gap:8px;flex-wrap:wrap">${['Customers','Inventory Items','Sales Orders','Sales Invoices','Receipts','Payments','Expenses','Employees'].map(x=>`<button class="btn" onclick="go('${x}')">${x}</button>`).join('')}</div></div>`;return}
if(current==='Reports'){c.innerHTML=`<h1>Reports</h1><div class="sub">Ringkasan rekod yang telah dimasukkan</div><div class="panel"><div class="panelhead">Laporan modul</div><table><thead><tr><th>Modul</th><th>Jumlah rekod</th></tr></thead><tbody>${Object.keys(schema).map(m=>`<tr><td>${m}</td><td>${records(m).length}</td></tr>`).join('')}</tbody></table></div>`;return}
const rows=records(current),fields=schema[current]||['Name','Code','Description'];c.innerHTML=`<h1>${current}</h1><div class="sub">Urus dan semak rekod ${current.toLowerCase()}</div><div class="panel"><div class="panelhead"><span>Records</span><div class="tools"><input id="search" placeholder="Search..." oninput="filterRows()"><button class="btn" onclick="filterRows()">Search</button><button class="btn gold" onclick="openForm()">+ Add New</button></div></div><div style="overflow:auto"><table><thead><tr>${fields.slice(0,5).map(f=>`<th>${f}</th>`).join('')}<th>Amount / Status</th><th>Tindakan</th></tr></thead><tbody id="tbody">${tableRows(rows,fields)}</tbody></table></div></div>`}
function tableRows(rows,fields){if(!rows.length)return `<tr><td class="empty" colspan="7">Tiada rekod. Klik Add New untuk mula.</td></tr>`;return rows.map((r,i)=>`<tr>${fields.slice(0,5).map(f=>`<td>${esc(r[f]||'—')}</td>`).join('')}<td>${esc(r.Amount||r['Net Pay']||r.Status||'—')}</td><td><div class="actions"><a class="link" onclick="openForm(${i})">Edit</a>${['Quotations','Sales Orders','Sales Invoices'].includes(current)?`<a class="link" onclick="printDocument(${i})">Print / PDF</a>`:''}${current==='Quotations'?`<a class="link" onclick="convertQuotation(${i},'Sales Orders')">To Order</a><a class="link" onclick="convertQuotation(${i},'Sales Invoices')">To Invoice</a>`:''}${current==='Sales Orders'?`<a class="link" onclick="createInvoiceFromOrder(${i})">Create Invoice</a>`:''}<a class="link" onclick="del(${i})">Delete</a></div></td></tr>`).join('')}
function filterRows(){let q=(document.getElementById('search')?.value||'').toLowerCase(),f=schema[current]||[];let filtered=records(current).filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));document.getElementById('tbody').innerHTML=tableRows(filtered,f)}
function openForm(i=null){editIndex=i;let fields=schema[current]||['Name','Code','Description'];let old=i===null?{}:records(current)[i];document.getElementById('modalTitle').textContent=(i===null?'New ':'Edit ')+current;let inputs=fields.map((f,n)=>{let type=/date/i.test(f)?'date':/amount|price|cost|balance|salary|debit|credit|quantity|deductions|allowances|life|tax|discount/i.test(f)?'number':'text';let val=old[f]||'';if(f==='Inventory Item'&&(current==='Sales Orders'||current==='Sales Invoices'||current==='Quotations')){let opts=records('Inventory Items').map(x=>`<option value="${esc(x.Name)}" ${val===x.Name?'selected':''}>${esc(x.Name)}${x.Code?' ('+esc(x.Code)+')':''}</option>`).join('');return `<div class="field"><label>${f}</label><select name="${f}" onchange="fillItemDetails(this.form,this.value)"><option value="">Select inventory item</option>${opts}</select></div>`}
if(f==='Customer'&&['Quotations','Sales Orders','Sales Invoices','Receipts','Credit Notes','Delivery Notes'].includes(current)){let opts=records('Customers').map(x=>`<option value="${esc(x.Name)}" ${val===x.Name?'selected':''}>${esc(x.Name)}</option>`).join('');return `<div class="field"><label>${f}</label><select name="${f}"><option value="">Select customer</option>${opts}</select></div>`}
if(f==='Supplier'&&['Purchase Orders','Purchase Invoices','Debit Notes'].includes(current)){let opts=records('Suppliers').map(x=>`<option value="${esc(x.Name)}" ${val===x.Name?'selected':''}>${esc(x.Name)}</option>`).join('');return `<div class="field"><label>${f}</label><select name="${f}"><option value="">Select supplier</option>${opts}</select></div>`}
return `<div class="field ${/address|description|terms/i.test(f)?'wide':''}"><label>${f}</label>${/address|description|terms/i.test(f)?`<textarea name="${esc(f)}">${esc(val)}</textarea>`:`<input name="${esc(f)}" type="${type}" ${type==='number'?'step="0.01"':''} value="${esc(val)}" placeholder="${f==='Code'?'Optional':''}">`}</div>`}).join('');document.getElementById('modalBody').innerHTML=`<form id="recordForm" onsubmit="saveRecord(event)"><div class="formwrap"><div class="formtitle">${current}</div><div class="formbody"><div class="formgrid">${inputs}</div></div><div class="formfoot"><button class="btn primary" type="submit">${i===null?'Create':'Save changes'}</button><button class="btn" type="button" onclick="closeModal()">Cancel</button>${i===null?'<button class="btn" type="button" onclick="saveAndAnother()">Create & add another</button>':''}</div></div></form>`;document.getElementById('modalback').style.display='block'}

function fillItemDetails(form,name){
 const item=records('Inventory Items').find(x=>x.Name===name); if(!item)return;
 const set=(field,value)=>{const el=form.querySelector(`[name="${field}"]`);if(el&&value!==undefined)el.value=value};
 set('Description',item.Description||'');
 set('Unit Price',item['Sales Price']||item['Unit Price']||'');
 set('Quantity','1');
}
function saveRecord(e,again=false){e.preventDefault();let obj={};new FormData(e.target).forEach((v,k)=>obj[k]=v);db[current]=records(current);if(editIndex===null)db[current].push(obj);else db[current][editIndex]=obj;save();closeModal();buildNav();render();if(again)openForm()}
function saveAndAnother(){saveRecord(new Event('submit',{cancelable:true,preventDefault(){}}),true)}
function closeModal(){document.getElementById('modalback').style.display='none'}
function del(i){if(confirm('Padam rekod ini?')){db[current].splice(i,1);save();buildNav();render()}}


function createInvoiceFromOrder(i){
 const o=records('Sales Orders')[i]; if(!o)return;
 const already=records('Sales Invoices').some(x=>x['Source Order']===o['Order Number']);
 if(already){alert('Invois untuk Sales Order ini sudah wujud.');return;}
 const inv={'Date':new Date().toISOString().slice(0,10),'Invoice Number':'INV-'+Date.now().toString().slice(-6),'Customer':o.Customer||'','Inventory Item':o['Inventory Item']||'','Description':o.Description||'','Quantity':o.Quantity||'1','Unit Price':o['Unit Price']||'0','Tax':'0','Due Date':'','Status':'Draft','Source Order':o['Order Number']||''};
 db['Sales Invoices']=db['Sales Invoices']||[];db['Sales Invoices'].push(inv);save();alert('Sales Invoice dicipta daripada Sales Order. Maklumat pelanggan dan item dibawa secara automatik.');go('Sales Invoices');
}
function convertQuotation(i,target){
 const q=records('Quotations')[i]; if(!q)return;
 if(!confirm('Cipta rekod '+target+' berdasarkan quotation ini?'))return;
 const d=new Date().toISOString().slice(0,10);
 const rec=target==='Sales Orders'
 ? {'Date':q['Quotation Date']||d,'Order Number':'SO-'+Date.now().toString().slice(-6),'Customer':q.Customer||'','Description':q['Service / Item']||q.Description||'','Quantity':q.Quantity||'1','Unit Price':q['Unit Price']||'0','Status':'Draft'}
 : {'Date':d,'Invoice Number':'INV-'+Date.now().toString().slice(-6),'Customer':q.Customer||'','Description':q['Service / Item']||q.Description||'','Quantity':q.Quantity||'1','Unit Price':q['Unit Price']||'0','Due Date':'','Status':'Draft'};
 db[target]=db[target]||[];db[target].push(rec);save();alert('Rekod '+target+' berjaya dicipta sebagai Draft. Semak dan lengkapkan butiran sebelum digunakan.');go(target);
}

function printDocument(i){
 const rec=records(current)[i]; if(!rec)return;
 const isQuote=current==='Quotations', isOrder=current==='Sales Orders';
 const title=isQuote?'QUOTATION':isOrder?'SALES ORDER':'SALES INVOICE';
 const number=rec['Quotation Number']||rec['Order Number']||rec['Invoice Number']||'';
 const date=rec['Quotation Date']||rec.Date||'';
 const qty=Number(rec.Quantity)||0, price=Number(rec['Unit Price'])||0;
 const subtotal=Number(rec.Total)||qty*price;
 const tax=Number(rec.Tax)||0, total=subtotal+(tax>0?subtotal*tax/100:0);
 const fields=Object.entries(rec).filter(([k,v])=>v!=='' && v!==null && !['Source Order'].includes(k));
 const rows=fields.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
 const w=window.open('','_blank','width=900,height=750');
 if(!w){alert('Sila benarkan pop-up untuk cetak PDF.');return;}
 w.document.write(`<!doctype html><html><head><title>${title} ${esc(number)}</title><style>
 body{font:14px Arial;color:#26333d;margin:38px}header{display:flex;justify-content:space-between;border-bottom:3px solid #2584c7;padding-bottom:18px}
 h1{font-size:25px;color:#2584c7;margin:0}h2{font-size:18px;margin:0 0 8px}.muted{color:#75828c;font-size:12px}
 .brand{font-weight:bold;letter-spacing:2px;font-size:20px}.brand span{color:#b58a37}
 .meta{margin:25px 0;display:flex;justify-content:space-between}.box{border:1px solid #dce2e7;padding:13px;min-width:40%}
 table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border:1px solid #dce2e7;text-align:left}th{background:#f4f7f9;width:28%}
 .total{margin:20px 0 0 auto;width:280px}.total div{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #ddd}
 footer{margin-top:55px;border-top:1px solid #ddd;padding-top:12px;color:#7b8790;font-size:11px}
 @media print{button{display:none}body{margin:15mm}}
 </style></head><body>
 <header><div><div class="brand">RANTAU <span>CREATIVE</span></div><div class="muted">RANTAU CREATIVE MANAGEMENT SYSTEM</div></div><div style="text-align:right"><h1>${title}</h1><div>${esc(number)}</div></div></header>
 <div class="meta"><div class="box"><h2>Bill To</h2><b>${esc(rec.Customer||'')}</b></div><div class="box"><b>Date:</b> ${esc(date)}<br><b>Status:</b> ${esc(rec.Status||'Draft')}</div></div>
 <h2>Document Details</h2><table>${rows}</table>
 <div class="total"><div><span>Subtotal</span><b>RM ${subtotal.toFixed(2)}</b></div><div><span>Tax</span><b>${tax}%</b></div><div><span>Total</span><b>RM ${total.toFixed(2)}</b></div></div>
 <footer>Terima kasih kerana memilih RANTAU CREATIVE.</footer>
 <p><button onclick="window.print()">Print / Save as PDF</button></p>
 <script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`);
 w.document.close();
}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RCMS-Backup.json';a.click();URL.revokeObjectURL(a.href)}
buildNav();render();
</script></body></html>
